      responses:
        "200":
          description: Population nutrition summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionPopulationSummary" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── Child ────────────────────────────────────────────────────────────────
    Child:
      type: object
      required: [id, fullName, dateOfBirth, gender, riskLevel, createdAt]
      properties:
        id:
          type: integer
        fullName:
          type: string
        dateOfBirth:
          type: string
        gender:
          type: string
          enum: [male, female, other]
        avatarUrl:
          type: ["string", "null"]
        parentName:
          type: ["string", "null"]
        parentEmail:
          type: ["string", "null"]
        parentPhone:
          type: ["string", "null"]
        schoolName:
          type: ["string", "null"]
        riskLevel:
          type: string
          enum: [low, moderate, high, critical]
        diagnosisNotes:
          type: ["string", "null"]
        therapistId:
          type: ["integer", "null"]
        clinicName:
          type: ["string", "null"]
        assignedDoctor:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    ChildInput:
      type: object
      required: [fullName, dateOfBirth, gender]
      properties:
        fullName:
          type: string
        dateOfBirth:
          type: string
        gender:
          type: string
          enum: [male, female, other]
        parentName:
          type: string
        parentEmail:
          type: string
        parentPhone:
          type: string
        schoolName:
          type: string
        clinicName:
          type: string
        assignedDoctor:
          type: string
        diagnosisNotes:
          type: string

    ChildUpdate:
      type: object
      properties:
        fullName:
          type: string
        dateOfBirth:
          type: string
        gender:
          type: string
          enum: [male, female, other]
        parentName:
          type: string
        parentEmail:
          type: string
        parentPhone:
          type: string
        schoolName:
          type: string
        clinicName:
          type: string
        assignedDoctor:
          type: string
        riskLevel:
          type: string
          enum: [low, moderate, high, critical]
        diagnosisNotes:
          type: string

    DomainScores:
      type: object
      required: [childId, communication, socialInteraction, attention, motorSkills, emotionalRegulation, assessedAt]
      properties:
        childId:
          type: integer
        communication:
          type: integer
        socialInteraction:
          type: integer
        attention:
          type: integer
        motorSkills:
          type: integer
        emotionalRegulation:
          type: integer
        assessedAt:
          type: string

    TimelineEvent:
      type: object
      required: [id, childId, eventType, title, occurredAt]
      properties:
        id:
          type: integer
        childId:
          type: integer
        eventType:
          type: string
          enum: [screening, appointment, therapy, milestone, report, referral]
        title:
          type: string
        description:
          type: ["string", "null"]
        occurredAt:
          type: string

    # ─── Screening ────────────────────────────────────────────────────────────
    Screening:
      type: object
      required: [id, childId, screeningType, status, riskLevel, createdAt]
      properties:
        id:
          type: integer
        childId:
          type: integer
        childName:
          type: ["string", "null"]
        screeningType:
          type: string
          enum: [parent_questionnaire, teacher_report, clinical_intake, behavioral_observation]
        status:
          type: string
          enum: [pending, in_progress, completed, reviewed]
        riskLevel:
          type: ["string", "null"]
          enum: [low, moderate, high, critical, null]
        communicationScore:
          type: ["integer", "null"]
        socialScore:
          type: ["integer", "null"]
        attentionScore:
          type: ["integer", "null"]
        motorScore:
          type: ["integer", "null"]
        emotionalScore:
          type: ["integer", "null"]
        behavioralClusters:
          type: ["string", "null"]
        referralRecommendations:
          type: ["string", "null"]
        clinicalSummary:
          type: ["string", "null"]
        createdAt:
          type: string
        completedAt:
          type: ["string", "null"]

    ScreeningInput:
      type: object
      required: [childId, screeningType]
      properties:
        childId:
          type: integer
        screeningType:
          type: string
          enum: [parent_questionnaire, teacher_report, clinical_intake, behavioral_observation]
        communicationScore:
          type: integer
        socialScore:
          type: integer
        attentionScore:
          type: integer
        motorScore:
          type: integer
        emotionalScore:
          type: integer
        behavioralClusters:
          type: string
        referralRecommendations:
          type: string
        clinicalSummary:
          type: string

    # ─── Availability ────────────────────────────────────────────────────────
    Availability:
      type: object
      required: [id, practitionerName, startTime, endTime, createdAt]
      properties:
        id:
          type: integer
        practitionerName:
          type: string
        specialistType:
          type: ["string", "null"]
        dayOfWeek:
          type: ["integer", "null"]
          description: "0=Sunday, 1=Monday, …, 6=Saturday. Null if specificDate is set."
        specificDate:
          type: ["string", "null"]
          description: "YYYY-MM-DD. Null if dayOfWeek is set."
        startTime:
          type: string
          description: "HH:MM"
        endTime:
          type: string
          description: "HH:MM"
        slotDurationMinutes:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string

    AvailabilityInput:
      type: object
      required: [practitionerName, startTime, endTime]
      properties:
        practitionerName:
          type: string
        specialistType:
          type: string
        dayOfWeek:
          type: integer
        specificDate:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        slotDurationMinutes:
          type: integer

    TimeSlot:
      type: object
      required: [time, available]
      properties:
        time:
          type: string
          description: "HH:MM"
        available:
          type: boolean

    # ─── Specialty Fees ───────────────────────────────────────────────────────
    SpecialtyFee:
      type: object
      required: [specialistType, feeAmount, currency, updatedAt]
      properties:
        specialistType:
          type: string
        feeAmount:
          type: number
        currency:
          type: string
        updatedAt:
          type: string

    SpecialtyFeeInput:
      type: object
      required: [feeAmount]
      properties:
        feeAmount:
          type: number
        currency:
          type: string

    # ─── Payment ─────────────────────────────────────────────────────────────
    Payment:
      type: object
      required: [id, appointmentId, amount, currency, status, createdAt]
      properties:
        id:
          type: integer
        appointmentId:
          type: integer
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [pending, paid, failed, refunded]
        transactionRef:
          type: ["string", "null"]
        paidAt:
          type: ["string", "null"]
        createdAt:
          type: string

    PaymentInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
        currency:
          type: string
        transactionRef:
          type: string

    # ─── Meeting URL ──────────────────────────────────────────────────────────
    MeetingUrlInput:
      type: object
      required: [meetingUrl]
      properties:
        meetingUrl:
          type: string

    # ─── Reschedule ───────────────────────────────────────────────────────────
    RescheduleRequest:
      type: object
      required: [id, appointmentId, requestedByRole, proposedAt, status, createdAt]
      properties:
        id:
          type: integer
        appointmentId:
          type: integer
        requestedByRole:
          type: string
          enum: [parent, practitioner]
        proposedAt:
          type: string
        reason:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        respondedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    RescheduleInput:
      type: object
      required: [requestedByRole, proposedAt]
      properties:
        requestedByRole:
          type: string
          enum: [parent, practitioner]
        proposedAt:
          type: string
        reason:
          type: string

    RescheduleResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected]

    # ─── Appointment ─────────────────────────────────────────────────────────
    Appointment:
      type: object
      required: [id, childId, specialistName, specialistType, scheduledAt, status, paymentStatus, createdAt]
      properties:
        id:
          type: integer
        childId:
          type: integer
        childName:
          type: ["string", "null"]
        specialistName:
          type: string
        specialistType:
          type: string
          enum: [developmental_pediatrician, psychologist, psychiatrist, speech_therapist, occupational_therapist, behavioral_therapist]
        scheduledAt:
          type: string
        durationMinutes:
          type: integer
        status:
          type: string
          enum: [scheduled, completed, cancelled, pending]
        telehealth:
          type: boolean
        meetingUrl:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        paymentStatus:
          type: string
          enum: [unpaid, paid, waived]
        feeAmount:
          type: ["number", "null"]
        createdAt:
          type: string

    AppointmentInput:
      type: object
      required: [childId, specialistName, specialistType, scheduledAt]
      properties:
        childId:
          type: integer
        specialistName:
          type: string
        specialistType:
          type: string
          enum: [developmental_pediatrician, psychologist, psychiatrist, speech_therapist, occupational_therapist, behavioral_therapist]
        scheduledAt:
          type: string
        durationMinutes:
          type: integer
        telehealth:
          type: boolean
        meetingUrl:
          type: string
        notes:
          type: string

    AppointmentUpdate:
      type: object
      properties:
        specialistName:
          type: string
        scheduledAt:
          type: string
        durationMinutes:
          type: integer
        status:
          type: string
          enum: [scheduled, completed, cancelled, pending]
        telehealth:
          type: boolean
        meetingUrl:
          type: string
        notes:
          type: string

    # ─── Therapy Plan ─────────────────────────────────────────────────────────
    TherapyPlan:
      type: object
      required: [id, childId, title, therapyType, status, startDate, createdAt]
      properties:
        id:
          type: integer
        childId:
          type: integer
        childName:
          type: ["string", "null"]
        title:
          type: string
        therapyType:
          type: string
          enum: [speech, occupational, behavioral, cognitive, physical, play]
        status:
          type: string
          enum: [active, completed, paused, pending]
        startDate:
          type: string
        endDate:
          type: ["string", "null"]
        goals:
          type: ["string", "null"]
        weeklyTasks:
          type: ["string", "null"]
        homeExercises:
          type: ["string", "null"]
        progressPercentage:
          type: integer
        therapistName:
          type: ["string", "null"]
        createdAt:
          type: string

    TherapyPlanInput:
      type: object
      required: [childId, title, therapyType, startDate]
      properties:
        childId:
          type: integer
        title:
          type: string
        therapyType:
          type: string
          enum: [speech, occupational, behavioral, cognitive, physical, play]
        startDate:
          type: string
        endDate:
          type: string
        goals:
          type: string
        weeklyTasks:
          type: string
        homeExercises:
          type: string
        therapistName:
          type: string

    TherapyPlanUpdate:
      type: object
      properties:
        title:
          type: string
        status:
          type: string
          enum: [active, completed, paused, pending]
        endDate:
          type: string
        goals:
          type: string
        weeklyTasks:
          type: string
        homeExercises:
          type: string
        progressPercentage:
          type: integer
        therapistName:
          type: string

    # ─── Report ───────────────────────────────────────────────────────────────
    Report:
      type: object
      required: [id, childId, reportType, title, createdAt]
      properties:
        id:
          type: integer
        childId:
          type: integer
        childName:
          type: ["string", "null"]
        reportType:
          type: string
          enum: [weekly_progress, monthly_assessment, clinical_summary, school_report, telehealth_note]
        title:
          type: string
        summary:
          type: ["string", "null"]
        findings:
          type: ["string", "null"]
        recommendations:
          type: ["string", "null"]
        urgencyLevel:
          type: string
          enum: [routine, moderate, urgent, critical]
        createdAt:
          type: string

    # ─── Dashboard ────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalChildren, activeTherapyPlans, upcomingAppointments, pendingScreenings, completedScreeningsThisMonth, averageRiskScore]
      properties:
        totalChildren:
          type: integer
        activeTherapyPlans:
          type: integer
        upcomingAppointments:
          type: integer
        pendingScreenings:
          type: integer
        completedScreeningsThisMonth:
          type: integer
        averageRiskScore:
          type: number

    ActivityItem:
      type: object
      required: [id, activityType, title, description, occurredAt]
      properties:
        id:
          type: integer
        activityType:
          type: string
          enum: [screening_completed, appointment_scheduled, therapy_updated, report_generated, child_added, milestone_reached]
        title:
          type: string
        description:
          type: string
        childName:
          type: ["string", "null"]
        childId:
          type: ["integer", "null"]
        occurredAt:
          type: string

    RiskDistribution:
      type: object
      required: [low, moderate, high, critical]
      properties:
        low:
          type: integer
        moderate:
          type: integer
        high:
          type: integer
        critical:
          type: integer

    VideoAnalysisRequest:
      type: object
      required: [protocolId, frames]
      properties:
        protocolId:
          type: string
          enum: [name_response, joint_play, communication_sample, sensory_motor]
        frames:
          type: array
          items:
            type: string
          description: Base64-encoded JPEG frames extracted from the uploaded video

    VideoAnalysisFinding:
      type: object
      required: [label, score, severity]
      properties:
        label:
          type: string
        score:
          type: integer
        severity:
          type: string
          enum: [normal, moderate, high]

    VideoAnalysisResult:
      type: object
      required: [findings, summary, recommendation, riskLevel]
      properties:
        findings:
          type: array
          items:
            $ref: "#/components/schemas/VideoAnalysisFinding"
        summary:
          type: string
        recommendation:
          type: string
        riskLevel:
          type: string
          enum: [low, moderate, high]

    AiAnalysisResult:
      type: object
      required: [id, childId, analysisType, modelUsed, createdAt]
      properties:
        id:
          type: integer
        childId:
          type: integer
        screeningId:
          type: ["integer", "null"]
        analysisType:
          type: string
        modelUsed:
          type: string
        inputSummary:
          type: ["string", "null"]
        rawOutput:
          type: ["string", "null"]
        structuredInsights:
          nullable: true
        confidenceScore:
          type: ["integer", "null"]
        flaggedConcerns:
          type: ["string", "null"]
        recommendations:
          type: ["string", "null"]
        processingTimeMs:
          type: ["integer", "null"]
        createdBy:
          type: ["string", "null"]
        createdAt:
          type: string

    AiAnalysisResultInput:
      type: object
      required: [childId, analysisType]
      properties:
        childId:
          type: integer
        screeningId:
          type: integer
        analysisType:
          type: string
        modelUsed:
          type: string
        inputSummary:
          type: string
        rawOutput:
          type: string
        structuredInsights:
          type: object
        confidenceScore:
          type: integer
        flaggedConcerns:
          type: string
        recommendations:
          type: string
        processingTimeMs:
          type: integer
        createdBy:
          type: string

    AuditLog:
      type: object
      required: [id, action, resourceType, outcome, occurredAt]
      properties:
        id:
          type: integer
        userId:
          type: ["string", "null"]
        userEmail:
          type: ["string", "null"]
        userRole:
