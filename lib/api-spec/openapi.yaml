openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ACCENTECX AI CARE Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: videoAnalysis
    description: AI video behavioral analysis
  - name: children
    description: Child profiles and digital twins
  - name: screenings
    description: Developmental screening assessments
  - name: appointments
    description: Telehealth and therapy appointments
  - name: availability
    description: Practitioner availability slots
  - name: fees
    description: Specialty fee configuration
  - name: payments
    description: Appointment payments
  - name: therapyPlans
    description: Therapy plans and sessions
  - name: users
    description: User management
  - name: reports
    description: AI-generated reports
  - name: dashboard
    description: Dashboard summary data

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Video Analysis ──────────────────────────────────────────────────────────
  /video-analysis:
    post:
      operationId: analyzeVideo
      tags: [videoAnalysis]
      summary: Analyze video frames with Gemini AI for behavioral assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoAnalysisRequest"
      responses:
        "200":
          description: AI analysis results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoAnalysisResult"
        "500":
          description: Analysis failed

  # ─── Children ───────────────────────────────────────────────────────────────
  /children:
    get:
      operationId: listChildren
      tags: [children]
      summary: List all child profiles for the current user
      responses:
        "200":
          description: List of children
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Child"
    post:
      operationId: createChild
      tags: [children]
      summary: Create a new child profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"

  /children/{id}:
    get:
      operationId: getChild
      tags: [children]
      summary: Get a child profile by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Child profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "404":
          description: Not found
    patch:
      operationId: updateChild
      tags: [children]
      summary: Update a child profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
    delete:
      operationId: deleteChild
      tags: [children]
      summary: Delete a child profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /children/{id}/domain-scores:
    get:
      operationId: getChildDomainScores
      tags: [children]
      summary: Get the latest domain scores (communication, social, attention, motor, emotional) for a child
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Domain scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainScores"

  /children/{id}/timeline:
    get:
      operationId: getChildTimeline
      tags: [children]
      summary: Get developmental event timeline for a child
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEvent"

  # ─── Screenings ─────────────────────────────────────────────────────────────
  /screenings:
    get:
      operationId: listScreenings
      tags: [screenings]
      summary: List screenings (optionally filter by child)
      parameters:
        - name: childId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of screenings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Screening"
    post:
      operationId: createScreening
      tags: [screenings]
      summary: Submit a new developmental screening
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreeningInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Screening"

  /screenings/{id}:
    get:
      operationId: getScreening
      tags: [screenings]
      summary: Get a screening by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Screening detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Screening"

  # ─── Appointments ────────────────────────────────────────────────────────────
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointments
      parameters:
        - name: childId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [scheduled, completed, cancelled, pending]
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Schedule a new appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{id}:
    get:
      operationId: getAppointment
      tags: [appointments]
      summary: Get an appointment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update appointment (reschedule, cancel, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  # ─── Availability ────────────────────────────────────────────────────────────
  /availability:
    get:
      operationId: listAvailability
      tags: [availability]
      summary: List practitioner availability blocks
      parameters:
        - name: practitionerName
          in: query
          required: false
          schema:
            type: string
        - name: specialistType
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of availability blocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Availability"
    post:
      operationId: createAvailability
      tags: [availability]
      summary: Create a practitioner availability block
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"

  /availability/{id}:
    delete:
      operationId: deleteAvailability
      tags: [availability]
      summary: Remove an availability block
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /availability/slots:
    get:
      operationId: getAvailableSlots
      tags: [availability]
      summary: Get computed available time slots for a practitioner on a date
      parameters:
        - name: practitionerName
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: true
          schema:
            type: string
          description: Date in YYYY-MM-DD format
        - name: durationMinutes
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Available time slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeSlot"

  # ─── Specialty Fees ───────────────────────────────────────────────────────────
  /specialty-fees:
    get:
      operationId: listSpecialtyFees
      tags: [fees]
      summary: List all specialty fees
      responses:
        "200":
          description: List of specialty fees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpecialtyFee"

  /specialty-fees/{specialistType}:
    put:
      operationId: upsertSpecialtyFee
      tags: [fees]
      summary: Create or update fee for a specialist type (admin only)
      parameters:
        - name: specialistType
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialtyFeeInput"
      responses:
        "200":
          description: Updated fee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialtyFee"

  # ─── Appointment — payment, meeting URL, reschedule ───────────────────────────
  /appointments/{id}/pay:
    post:
      operationId: payAppointment
      tags: [payments]
      summary: Process payment for an appointment (simulated)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "200":
          description: Payment record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /appointments/{id}/payment:
    get:
      operationId: getAppointmentPayment
      tags: [payments]
      summary: Get payment record for an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          description: No payment found

  /appointments/{id}/meeting-url:
    patch:
      operationId: setMeetingUrl
      tags: [appointments]
      summary: Practitioner sets the meeting URL for a telehealth appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingUrlInput"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{id}/reschedule:
    get:
      operationId: getRescheduleRequest
      tags: [appointments]
      summary: Get the latest reschedule request for an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reschedule request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleRequest"
        "404":
          description: No reschedule request found
    post:
      operationId: requestReschedule
      tags: [appointments]
      summary: Request to reschedule an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleInput"
      responses:
        "201":
          description: Reschedule request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleRequest"
    patch:
      operationId: respondToReschedule
      tags: [appointments]
      summary: Approve or reject a reschedule request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleResponse"
      responses:
        "200":
          description: Updated reschedule request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleRequest"

  # ─── Therapy Plans ───────────────────────────────────────────────────────────
  /therapy-plans:
    get:
      operationId: listTherapyPlans
      tags: [therapyPlans]
      summary: List therapy plans
      parameters:
        - name: childId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of therapy plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TherapyPlan"
    post:
      operationId: createTherapyPlan
      tags: [therapyPlans]
      summary: Create a therapy plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TherapyPlanInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TherapyPlan"

  /therapy-plans/{id}:
    get:
      operationId: getTherapyPlan
      tags: [therapyPlans]
      summary: Get a therapy plan by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Therapy plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TherapyPlan"
    patch:
      operationId: updateTherapyPlan
      tags: [therapyPlans]
      summary: Update a therapy plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TherapyPlanUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TherapyPlan"

  # ─── Reports ─────────────────────────────────────────────────────────────────
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List AI-generated reports
      parameters:
        - name: childId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get a report by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  # ─── Dashboard / Wow endpoints ───────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get overall dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent activity feed across all children
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/risk-distribution:
    get:
      operationId: getRiskDistribution
      tags: [dashboard]
      summary: Get count of children by risk level
      responses:
        "200":
          description: Risk level breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskDistribution"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── Child ────────────────────────────────────────────────────────────────
    Child:
      type: object
      required: [id, fullName, dateOfBirth, gender, riskLevel, createdAt]
      properties:
        id:
          type: integer
        fullName:
          type: string
        dateOfBirth:
          type: string
        gender:
          type: string
          enum: [male, female, other]
        avatarUrl:
          type: ["string", "null"]
        parentName:
          type: ["string", "null"]
        parentEmail:
          type: ["string", "null"]
        parentPhone:
          type: ["string", "null"]
        schoolName:
          type: ["string", "null"]
        riskLevel:
          type: string
          enum: [low, moderate, high, critical]
        diagnosisNotes:
          type: ["string", "null"]
        therapistId:
          type: ["integer", "null"]
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    ChildInput:
      type: object
      required: [fullName, dateOfBirth, gender]
      properties:
        fullName:
          type: string
        dateOfBirth:
          type: string
        gender:
          type: string
          enum: [male, female, other]
        parentName:
          type: string
        parentEmail:
          type: string
        parentPhone:
          type: string
        schoolName:
          type: string
        diagnosisNotes:
          type: string

    ChildUpdate:
      type: object
      properties:
        fullName:
          type: string
        dateOfBirth:
          type: string
        gender:
          type: string
          enum: [male, female, other]
        parentName:
          type: string
        parentEmail:
          type: string
        parentPhone:
          type: string
        schoolName:
          type: string
        riskLevel:
          type: string
          enum: [low, moderate, high, critical]
        diagnosisNotes:
          type: string

    DomainScores:
      type: object
      required: [childId, communication, socialInteraction, attention, motorSkills, emotionalRegulation, assessedAt]
      properties:
        childId:
          type: integer
        communication:
          type: integer
        socialInteraction:
          type: integer
        attention:
          type: integer
        motorSkills:
          type: integer
        emotionalRegulation:
          type: integer
        assessedAt:
          type: string

    TimelineEvent:
      type: object
      required: [id, childId, eventType, title, occurredAt]
      properties:
        id:
          type: integer
        childId:
          type: integer
        eventType:
          type: string
          enum: [screening, appointment, therapy, milestone, report, referral]
        title:
          type: string
        description:
          type: ["string", "null"]
        occurredAt:
          type: string

    # ─── Screening ────────────────────────────────────────────────────────────
    Screening:
      type: object
      required: [id, childId, screeningType, status, riskLevel, createdAt]
      properties:
        id:
          type: integer
        childId:
          type: integer
        childName:
          type: ["string", "null"]
        screeningType:
          type: string
          enum: [parent_questionnaire, teacher_report, clinical_intake, behavioral_observation]
        status:
          type: string
          enum: [pending, in_progress, completed, reviewed]
        riskLevel:
          type: ["string", "null"]
          enum: [low, moderate, high, critical, null]
        communicationScore:
          type: ["integer", "null"]
        socialScore:
          type: ["integer", "null"]
        attentionScore:
          type: ["integer", "null"]
        motorScore:
          type: ["integer", "null"]
        emotionalScore:
          type: ["integer", "null"]
        behavioralClusters:
          type: ["string", "null"]
        referralRecommendations:
          type: ["string", "null"]
        clinicalSummary:
          type: ["string", "null"]
        createdAt:
          type: string
        completedAt:
          type: ["string", "null"]

    ScreeningInput:
      type: object
      required: [childId, screeningType]
      properties:
        childId:
          type: integer
        screeningType:
          type: string
          enum: [parent_questionnaire, teacher_report, clinical_intake, behavioral_observation]
        communicationScore:
          type: integer
        socialScore:
          type: integer
        attentionScore:
          type: integer
        motorScore:
          type: integer
        emotionalScore:
          type: integer
        behavioralClusters:
          type: string
        referralRecommendations:
          type: string
        clinicalSummary:
          type: string

    # ─── Availability ────────────────────────────────────────────────────────
    Availability:
      type: object
      required: [id, practitionerName, startTime, endTime, createdAt]
      properties:
        id:
          type: integer
        practitionerName:
          type: string
        specialistType:
          type: ["string", "null"]
        dayOfWeek:
          type: ["integer", "null"]
          description: "0=Sunday, 1=Monday, …, 6=Saturday. Null if specificDate is set."
        specificDate:
          type: ["string", "null"]
          description: "YYYY-MM-DD. Null if dayOfWeek is set."
        startTime:
          type: string
          description: "HH:MM"
        endTime:
          type: string
          description: "HH:MM"
        slotDurationMinutes:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string

    AvailabilityInput:
      type: object
      required: [practitionerName, startTime, endTime]
      properties:
        practitionerName:
          type: string
        specialistType:
          type: string
        dayOfWeek:
          type: integer
        specificDate:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        slotDurationMinutes:
          type: integer

    TimeSlot:
      type: object
      required: [time, available]
      properties:
        time:
          type: string
          description: "HH:MM"
        available:
          type: boolean

    # ─── Specialty Fees ───────────────────────────────────────────────────────
    SpecialtyFee:
      type: object
      required: [specialistType, feeAmount, currency, updatedAt]
      properties:
        specialistType:
          type: string
        feeAmount:
          type: number
        currency:
          type: string
        updatedAt:
          type: string

    SpecialtyFeeInput:
      type: object
      required: [feeAmount]
      properties:
        feeAmount:
          type: number
        currency:
          type: string

    # ─── Payment ─────────────────────────────────────────────────────────────
    Payment:
      type: object
      required: [id, appointmentId, amount, currency, status, createdAt]
      properties:
        id:
          type: integer
        appointmentId:
          type: integer
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [pending, paid, failed, refunded]
        transactionRef:
          type: ["string", "null"]
        paidAt:
          type: ["string", "null"]
        createdAt:
          type: string

    PaymentInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
        currency:
          type: string
        transactionRef:
          type: string

    # ─── Meeting URL ──────────────────────────────────────────────────────────
    MeetingUrlInput:
      type: object
      required: [meetingUrl]
      properties:
        meetingUrl:
          type: string

    # ─── Reschedule ───────────────────────────────────────────────────────────
    RescheduleRequest:
      type: object
      required: [id, appointmentId, requestedByRole, proposedAt, status, createdAt]
      properties:
        id:
          type: integer
        appointmentId:
          type: integer
        requestedByRole:
          type: string
