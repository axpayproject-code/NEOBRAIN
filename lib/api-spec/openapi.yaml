openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ACCENTECX AI CARE Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: videoAnalysis
    description: AI video behavioral analysis
  - name: children
    description: Child profiles and digital twins
  - name: screenings
    description: Developmental screening assessments
  - name: appointments
    description: Telehealth and therapy appointments
  - name: availability
    description: Practitioner availability slots
  - name: fees
    description: Specialty fee configuration
  - name: payments
    description: Appointment payments
  - name: therapyPlans
    description: Therapy plans and sessions
  - name: users
    description: User management
  - name: reports
    description: AI-generated reports
  - name: dashboard
    description: Dashboard summary data
  - name: aiAnalysis
    description: Persisted AI analysis results
  - name: auditLogs
    description: Security and compliance audit trail
  - name: therapySessionNotes
    description: Individual therapy session notes
  - name: developmentalMilestones
    description: Child developmental milestone tracking
  - name: riskHistory
    description: Historical risk level changes per child
  - name: screeningResponses
    description: Individual question-level screening responses
  - name: documents
    description: Document and file metadata

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Video Analysis ──────────────────────────────────────────────────────────
  /video-analysis:
    post:
      operationId: analyzeVideo
      tags: [videoAnalysis]
      summary: Analyze video frames with Gemini AI for behavioral assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoAnalysisRequest"
      responses:
        "200":
          description: AI analysis results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoAnalysisResult"
        "500":
          description: Analysis failed

  # ─── Children ───────────────────────────────────────────────────────────────
  /children:
    get:
      operationId: listChildren
      tags: [children]
      summary: List all child profiles for the current user
      responses:
        "200":
          description: List of children
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Child"
    post:
      operationId: createChild
      tags: [children]
      summary: Create a new child profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"

  /children/{id}:
    get:
      operationId: getChild
      tags: [children]
      summary: Get a child profile by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Child profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "404":
          description: Not found
    patch:
      operationId: updateChild
      tags: [children]
      summary: Update a child profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
    delete:
      operationId: deleteChild
      tags: [children]
      summary: Delete a child profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /children/{id}/domain-scores:
    get:
      operationId: getChildDomainScores
      tags: [children]
      summary: Get the latest domain scores (communication, social, attention, motor, emotional) for a child
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Domain scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainScores"

  /children/{id}/timeline:
    get:
      operationId: getChildTimeline
      tags: [children]
      summary: Get developmental event timeline for a child
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEvent"

  # ─── Screenings ─────────────────────────────────────────────────────────────
  /screenings:
    get:
      operationId: listScreenings
      tags: [screenings]
      summary: List screenings (optionally filter by child)
      parameters:
        - name: childId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of screenings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Screening"
    post:
      operationId: createScreening
      tags: [screenings]
      summary: Submit a new developmental screening
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreeningInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Screening"

  /screenings/{id}:
    get:
      operationId: getScreening
      tags: [screenings]
      summary: Get a screening by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Screening detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Screening"

  # ─── Appointments ────────────────────────────────────────────────────────────
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointments
      parameters:
        - name: childId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [scheduled, completed, cancelled, pending]
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Schedule a new appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{id}:
    get:
      operationId: getAppointment
      tags: [appointments]
      summary: Get an appointment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update appointment (reschedule, cancel, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  # ─── Availability ────────────────────────────────────────────────────────────
  /availability:
    get:
      operationId: listAvailability
      tags: [availability]
      summary: List practitioner availability blocks
      parameters:
        - name: practitionerName
          in: query
          required: false
          schema:
            type: string
        - name: specialistType
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of availability blocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Availability"
    post:
      operationId: createAvailability
      tags: [availability]
      summary: Create a practitioner availability block
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"

  /availability/{id}:
    delete:
      operationId: deleteAvailability
      tags: [availability]
      summary: Remove an availability block
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /availability/slots:
    get:
      operationId: getAvailableSlots
      tags: [availability]
      summary: Get computed available time slots for a practitioner on a date
      parameters:
        - name: practitionerName
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: true
          schema:
            type: string
          description: Date in YYYY-MM-DD format
        - name: durationMinutes
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Available time slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeSlot"

  # ─── Specialty Fees ───────────────────────────────────────────────────────────
  /specialty-fees:
    get:
      operationId: listSpecialtyFees
      tags: [fees]
      summary: List all specialty fees
      responses:
        "200":
          description: List of specialty fees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpecialtyFee"

  /specialty-fees/{specialistType}:
    put:
      operationId: upsertSpecialtyFee
      tags: [fees]
      summary: Create or update fee for a specialist type (admin only)
      parameters:
        - name: specialistType
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialtyFeeInput"
      responses:
        "200":
          description: Updated fee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialtyFee"

  # ─── Appointment — payment, meeting URL, reschedule ───────────────────────────
  /appointments/{id}/pay:
    post:
      operationId: payAppointment
      tags: [payments]
      summary: Process payment for an appointment (simulated)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "200":
          description: Payment record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /appointments/{id}/payment:
    get:
      operationId: getAppointmentPayment
      tags: [payments]
      summary: Get payment record for an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          description: No payment found

  /appointments/{id}/meeting-url:
    patch:
      operationId: setMeetingUrl
      tags: [appointments]
      summary: Practitioner sets the meeting URL for a telehealth appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingUrlInput"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{id}/reschedule:
    get:
      operationId: getRescheduleRequest
      tags: [appointments]
      summary: Get the latest reschedule request for an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reschedule request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleRequest"
        "404":
          description: No reschedule request found
    post:
      operationId: requestReschedule
      tags: [appointments]
      summary: Request to reschedule an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleInput"
      responses:
        "201":
          description: Reschedule request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleRequest"
    patch:
      operationId: respondToReschedule
      tags: [appointments]
      summary: Approve or reject a reschedule request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleResponse"
      responses:
        "200":
          description: Updated reschedule request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleRequest"

  # ─── Therapy Plans ───────────────────────────────────────────────────────────
  /therapy-plans:
    get:
      operationId: listTherapyPlans
      tags: [therapyPlans]
      summary: List therapy plans
      parameters:
        - name: childId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of therapy plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TherapyPlan"
    post:
      operationId: createTherapyPlan
      tags: [therapyPlans]
      summary: Create a therapy plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TherapyPlanInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TherapyPlan"

  /therapy-plans/{id}:
    get:
      operationId: getTherapyPlan
      tags: [therapyPlans]
      summary: Get a therapy plan by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Therapy plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TherapyPlan"
    patch:
      operationId: updateTherapyPlan
      tags: [therapyPlans]
      summary: Update a therapy plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TherapyPlanUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TherapyPlan"

  # ─── Reports ─────────────────────────────────────────────────────────────────
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List AI-generated reports
      parameters:
        - name: childId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get a report by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  # ─── Dashboard / Wow endpoints ───────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get overall dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent activity feed across all children
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/risk-distribution:
    get:
      operationId: getRiskDistribution
      tags: [dashboard]
      summary: Get count of children by risk level
      responses:
        "200":
          description: Risk level breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskDistribution"

  # ─── AI Analysis Results ─────────────────────────────────────────────────────
  /ai-analysis:
    get:
      operationId: listAiAnalysisResults
      tags: [aiAnalysis]
      summary: List persisted AI analysis results
      parameters:
        - name: childId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of AI analysis results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiAnalysisResult"
    post:
      operationId: createAiAnalysisResult
      tags: [aiAnalysis]
      summary: Store an AI analysis result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAnalysisResultInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnalysisResult"

  /ai-analysis/{id}:
    get:
      operationId: getAiAnalysisResult
      tags: [aiAnalysis]
      summary: Get a single AI analysis result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: AI analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnalysisResult"
        "404":
          description: Not found

  # ─── Audit Logs ──────────────────────────────────────────────────────────────
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [auditLogs]
      summary: List audit log entries
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
    post:
      operationId: createAuditLog
      tags: [auditLogs]
      summary: Write an audit log entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditLogInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLog"

  # ─── Therapy Session Notes ───────────────────────────────────────────────────
  /therapy-session-notes:
    get:
      operationId: listTherapySessionNotes
      tags: [therapySessionNotes]
      summary: List therapy session notes
      parameters:
        - name: therapyPlanId
          in: query
          schema:
            type: integer
        - name: childId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Session notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TherapySessionNote"
    post:
      operationId: createTherapySessionNote
      tags: [therapySessionNotes]
      summary: Create a therapy session note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TherapySessionNoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TherapySessionNote"

  /therapy-session-notes/{id}:
    patch:
      operationId: updateTherapySessionNote
      tags: [therapySessionNotes]
      summary: Update a therapy session note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TherapySessionNoteInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TherapySessionNote"
    delete:
      operationId: deleteTherapySessionNote
      tags: [therapySessionNotes]
      summary: Delete a therapy session note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Developmental Milestones ────────────────────────────────────────────────
  /developmental-milestones:
    get:
      operationId: listDevelopmentalMilestones
      tags: [developmentalMilestones]
      summary: List developmental milestones for a child
      parameters:
        - name: childId
          in: query
          schema:
            type: integer
        - name: domain
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Milestones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DevelopmentalMilestone"
    post:
      operationId: createDevelopmentalMilestone
      tags: [developmentalMilestones]
      summary: Record a developmental milestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevelopmentalMilestoneInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevelopmentalMilestone"

  /developmental-milestones/{id}:
    patch:
      operationId: updateDevelopmentalMilestone
      tags: [developmentalMilestones]
      summary: Update a developmental milestone
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevelopmentalMilestoneInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevelopmentalMilestone"

  # ─── Risk History ─────────────────────────────────────────────────────────────
  /risk-history:
    get:
      operationId: listRiskHistory
      tags: [riskHistory]
      summary: List risk history entries
      parameters:
        - name: childId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Risk history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskHistoryEntry"

  /risk-history/{childId}:
    get:
      operationId: getChildRiskHistory
      tags: [riskHistory]
      summary: Get full risk history for a specific child
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Risk history for child
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskHistoryEntry"

  # ─── Screening Responses ─────────────────────────────────────────────────────
  /screening-responses:
    get:
      operationId: listScreeningResponses
      tags: [screeningResponses]
      summary: List individual screening question responses
      parameters:
        - name: screeningId
          in: query
          schema:
            type: integer
        - name: childId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Screening responses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScreeningResponse"
    post:
      operationId: createScreeningResponses
      tags: [screeningResponses]
      summary: Submit screening question responses (single or bulk array)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ScreeningResponseInput"
                - type: array
                  items:
                    $ref: "#/components/schemas/ScreeningResponseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScreeningResponse"

  # ─── Documents ───────────────────────────────────────────────────────────────
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents (excludes soft-deleted)
      parameters:
        - name: childId
          in: query
          schema:
            type: integer
        - name: documentType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Store document metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a document by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: Not found
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Soft-delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Nutrition ────────────────────────────────────────────────────────────────
  /nutrition/profile/{childId}:
    get:
      operationId: getNutritionProfile
      tags: [nutrition]
      summary: Get nutrition profile for a child
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Nutrition profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionProfile" }
        "404":
          description: Not found
    patch:
      operationId: updateNutritionProfile
      tags: [nutrition]
      summary: Update nutrition profile
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NutritionProfileInput" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionProfile" }

  /nutrition/profile:
    post:
      operationId: createNutritionProfile
      tags: [nutrition]
      summary: Create nutrition profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NutritionProfileInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionProfile" }

  /nutrition/growth/{childId}:
    get:
      operationId: listGrowthRecords
      tags: [nutrition]
      summary: List growth records for a child
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: List of growth records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GrowthRecord" }

  /nutrition/growth:
    post:
      operationId: createGrowthRecord
      tags: [nutrition]
      summary: Record a growth measurement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrowthRecordInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrowthRecord" }

  /nutrition/feeding/{childId}:
    get:
      operationId: listFeedingHistory
      tags: [nutrition]
      summary: List feeding history for a child
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Feeding history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeedingEntry" }

  /nutrition/feeding:
    post:
      operationId: createFeedingEntry
      tags: [nutrition]
      summary: Log a feeding entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedingEntryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedingEntry" }

  /nutrition/meals/{childId}:
    get:
      operationId: listMealLogs
      tags: [nutrition]
      summary: List meal logs for a child
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Meal logs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MealLog" }

  /nutrition/meals:
    post:
      operationId: createMealLog
      tags: [nutrition]
      summary: Log a meal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MealLogInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealLog" }

  /nutrition/food-exposures/{childId}:
    get:
      operationId: listFoodExposures
      tags: [nutrition]
      summary: List food exposures for a child
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Food exposures
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FoodExposure" }

  /nutrition/food-exposures:
    post:
      operationId: createFoodExposure
      tags: [nutrition]
      summary: Record a new food introduction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FoodExposureInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FoodExposure" }

  /nutrition/insights/{childId}:
    get:
      operationId: listNutritionInsights
      tags: [nutrition]
      summary: List AI nutrition insights for a child
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Nutrition insights
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NutritionInsight" }

  /nutrition/insights:
    post:
      operationId: createNutritionInsight
      tags: [nutrition]
